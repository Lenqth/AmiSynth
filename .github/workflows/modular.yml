name: Modular web validation

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'package*.json', '.github/workflows/modular.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'package*.json', '.github/workflows/modular.yml']

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
